; WinCE FTP 服务器配置 —— 中文注释版
; 用法：把这个文件命名为 ftpd.ini，放到 ftpd.exe 同一个目录，重新运行程序生效。
; 注意：文件请用 UTF-8 保存（程序自己生成的那份是英文注释，功能完全一样）。
;
; 各字段说明（等号左边不要改，右边按需改）：

; 监听端口。默认 21。如果车机上 21 被占用、或连不上，改成 2121，
; 手机端填的端口也要跟着改成 2121。
Port=21

; 对外暴露的根目录。"\" 表示整个设备（所有盘都能看到）。
; 想只共享存储卡，就写 \Storage Card 或 \SDMMC（按你车机实际盘符）。
; 想只共享某个文件夹，就写 \Storage Card\共享。
Root=\

; 登录用户名。留空 = 匿名模式，手机端随便填个名字就能进。
User=ftp

; 登录密码。留空 = 不需要密码。
; ⚠ 部署后建议改掉默认的 ftp/ftp。
Password=ftp

; 只读开关。0 = 手机可以上传、改名、删除、建文件夹。
; 改成 1 = 手机只能浏览和下载，改不了车机上的任何东西。
ReadOnly=0

; 最大同时连接数，1–32。每个连接占一个线程，车机内存小就别开太大。
MaxClients=4

; 日志文件路径。留空 = 自动写在 ftpd.exe 同目录的 ftpd.log。
; 填 none = 完全不写日志。
; 排错时先看这个文件，里面有手机 IP、每条命令、以及车机自己的 IP。
LogFile=

; 被动模式回报给手机的 IP。单网卡设备留空即可（程序自动取本机地址）。
; 只有当车机有多个网卡/多个 IP、手机连不上数据端口时才需要手动指定，
; 例如 PasvIP=192.168.1.23
PasvIP=

; 文件名编码。UTF8 = 现代手机 App 都正常（推荐，保持默认）。
; 如果某台老手机/老客户端列目录中文全是乱码，改成 GBK 再试。
Encoding=UTF8
